      const translations = {
        en: {
          navWriting: 'Writing',
          navAbout: 'About',
          navPhotography: 'Photography',
          heroEyebrow: 'Engineer · Writer · Observer',
          heroTitleMain: 'A quiet place for ideas.',
          heroTitleSub: 'Engineering notes, essays, and a life in progress.',
          heroCopy: 'I write about backend engineering, programming languages, computer science, and the craft of learning.',
          readWriting: 'Read writing',
          learnMore: 'About me',
          floatingNote: 'Keep building.<br />Keep observing.',
          featuredKicker: 'Featured Notes',
          featuredTitle: 'Recent writing',
          featuredIntro: 'Difficult things begin with what is easy; great things begin with what is small.',
          readArticle: 'Read article',
          archiveKicker: 'Writing Archive',
          archiveTitle: 'All notes',
          filterAll: 'All',
          paginationPrev: 'Previous',
          paginationNext: 'Next',
          photoEyebrow: 'Photography Journal',
          photoTitle: 'Light, distance,<br />and ordinary days.',
          photoIntro: 'Photography is not proof of where I have been. It is a way to preserve the relationship between light, place, and a particular state of mind.',
          backHome: 'Back to home',
          backToTop: 'Back to top',
          footerText: '© 2026 Siyuan. Built with patience and plain HTML.'
        },
        zh: {
          navWriting: '文章',
          navAbout: '关于',
          navPhotography: '摄影',
          heroEyebrow: '工程师 · 写作者 · 观察者',
          heroTitleMain: '一处安静的思想空间。',
          heroTitleSub: '记录技术、随笔，以及仍在发生的生活。',
          heroCopy: '我记录后端工程、编程语言、计算机科学，以及持续学习这件事本身。',
          readWriting: '阅读文章',
          learnMore: '关于我',
          floatingNote: '持续构建。<br />持续观察。',
          featuredKicker: '精选文章',
          featuredTitle: '最近更新',
          featuredIntro: '天下难事，必作于易；天下大事，必作于细。',
          readArticle: '阅读全文',
          archiveKicker: '文章归档',
          archiveTitle: '全部文章',
          filterAll: '全部',
          paginationPrev: '上一页',
          paginationNext: '下一页',
          photoEyebrow: '摄影记录',
          photoTitle: '光线、距离，<br />以及普通的日子。',
          photoIntro: '摄影不是为了证明我去过哪里，而是为了保存某个瞬间里，光线、地点与情绪之间的关系。',
          backHome: '返回首页',
          backToTop: '回到顶部',
          footerText: '© 2026 Siyuan. 使用耐心与原生 HTML 构建。'
        }
      };

      const homeView = document.getElementById('homeView');
      const photographyView = document.getElementById('photographyView');
      const languageToggle = document.getElementById('languageToggle');
      const photoNav = document.getElementById('photoNav');
      const backToTop = document.getElementById('backToTop');
      let currentLanguage = localStorage.getItem('siyuan-language') || 'en';

      function applyLanguage(language) {
        currentLanguage = language;
        document.documentElement.lang = language === 'zh' ? 'zh-CN' : 'en';

        document.querySelectorAll('[data-i18n]').forEach((element) => {
          const key = element.dataset.i18n;
          if (translations[language][key] !== undefined) {
            element.innerHTML = translations[language][key];
          }
        });

        document.querySelectorAll('[data-photo-title]').forEach((element) => {
          const card = element.closest('.photo-card');
          element.textContent = language === 'zh' ? card.dataset.titleZh : card.dataset.titleEn;
        });

        if (languageToggle) {
          languageToggle.setAttribute(
            'aria-label',
            language === 'en' ? '切换到中文' : 'Switch to English',
          );
          languageToggle.setAttribute(
            'title',
            language === 'en' ? '切换到中文' : 'Switch to English',
          );
          languageToggle.dataset.language = language;
        }

        if (backToTop) {
          backToTop.setAttribute('aria-label', translations[language].backToTop);
          backToTop.setAttribute('title', translations[language].backToTop);
        }

        renderPostList();
        localStorage.setItem('siyuan-language', language);
      }

      function showRoute(route, updateHash = true) {
        if (!homeView || !photographyView) {
          window.location.href = route === 'photography' ? '/#photography' : '/#home';
          return;
        }

        const isPhotography = route === 'photography';
        homeView.hidden = isPhotography;
        photographyView.hidden = !isPhotography;
        photoNav?.classList.toggle('active', isPhotography);
        if (isPhotography) {
          document.body.dataset.photoNavStatic = 'true';
        } else {
          delete document.body.dataset.photoNavStatic;
        }

        if (updateHash) {
          history.pushState(null, '', isPhotography ? '#photography' : '#home');
        }

        window.scrollTo({ top: 0, behavior: 'auto' });
        document.querySelectorAll('.reveal').forEach((element) => {
          if (!element.closest('[hidden]')) element.classList.add('visible');
        });
      }

      function routeFromHash() {
        return window.location.hash === '#photography' ? 'photography' : 'home';
      }

      document.querySelectorAll('[data-route]').forEach((element) => {
        element.addEventListener('click', (event) => {
          event.preventDefault();
          showRoute(element.dataset.route);
        });
      });

      document.querySelectorAll('[data-scroll-target]').forEach((element) => {
        element.addEventListener('click', () => {
          const targetId = element.dataset.scrollTarget;

          if (!homeView || !document.getElementById(targetId)) {
            window.location.href = `/#${targetId}`;
            return;
          }

          if (homeView.hidden) {
            showRoute('home');
            requestAnimationFrame(() => {
              document.getElementById(targetId)?.scrollIntoView({ behavior: 'smooth' });
            });
          } else {
            document.getElementById(targetId)?.scrollIntoView({ behavior: 'smooth' });
          }
        });
      });

      languageToggle?.addEventListener('click', () => {
        applyLanguage(currentLanguage === 'en' ? 'zh' : 'en');
      });

      function updateBackToTop() {
        backToTop?.classList.toggle('visible', window.scrollY > 420);
      }

      backToTop?.addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });

      window.addEventListener('scroll', updateBackToTop, { passive: true });

      window.addEventListener('popstate', () => {
        if (homeView && photographyView) showRoute(routeFromHash(), false);
      });

      const filterButtons = document.querySelectorAll('.filter-button');
      const postRows = document.querySelectorAll('[data-paginated-posts] .post-row');
      const pagination = document.querySelector('[data-pagination]');
      const pagePrev = document.querySelector('[data-page-prev]');
      const pageNext = document.querySelector('[data-page-next]');
      const pageStatus = document.querySelector('[data-page-status]');
      const pageSize = 6;
      let currentFilter = 'all';
      let currentPage = 1;

      function rowsForCurrentFilter() {
        return Array.from(postRows).filter((row) => {
          if (currentFilter === 'all') return true;
          return row.dataset.tags?.split(' ').includes(currentFilter);
        });
      }

      function renderPostList() {
        if (!postRows.length) return;

        const rows = rowsForCurrentFilter();
        const totalPages = Math.max(1, Math.ceil(rows.length / pageSize));
        currentPage = Math.min(currentPage, totalPages);
        const start = (currentPage - 1) * pageSize;
        const end = start + pageSize;

        postRows.forEach((row) => {
          row.hidden = true;
        });

        rows.forEach((row, index) => {
          row.hidden = !(index >= start && index < end);
        });

        if (pagination) {
          pagination.hidden = rows.length <= pageSize;
        }

        if (pagePrev) pagePrev.disabled = currentPage <= 1;
        if (pageNext) pageNext.disabled = currentPage >= totalPages;

        if (pageStatus) {
          pageStatus.textContent = currentLanguage === 'zh'
            ? `第 ${currentPage} / ${totalPages} 页`
            : `Page ${currentPage} / ${totalPages}`;
        }
      }

      filterButtons.forEach((button) => {
        button.addEventListener('click', () => {
          currentFilter = button.dataset.filter ?? 'all';
          currentPage = 1;
          filterButtons.forEach((item) => item.classList.remove('active'));
          button.classList.add('active');
          renderPostList();
        });
      });

      pagePrev?.addEventListener('click', () => {
        currentPage = Math.max(1, currentPage - 1);
        renderPostList();
        document.getElementById('writing')?.scrollIntoView({ behavior: 'smooth' });
      });

      pageNext?.addEventListener('click', () => {
        currentPage += 1;
        renderPostList();
        document.getElementById('writing')?.scrollIntoView({ behavior: 'smooth' });
      });

      const lightbox = document.getElementById('lightbox');
      const lightboxVisual = document.getElementById('lightboxVisual');
      const lightboxTitle = document.getElementById('lightboxTitle');
      const lightboxMeta = document.getElementById('lightboxMeta');
      const lightboxClose = document.getElementById('lightboxClose');
      let lastFocusedElement = null;

      function closeLightbox() {
        lightbox?.classList.remove('open');
        if (lightboxVisual) lightboxVisual.innerHTML = '';
        document.body.style.overflow = '';
        if (lastFocusedElement) lastFocusedElement.focus();
      }

      document.querySelectorAll('.photo-card').forEach((card) => {
        card.addEventListener('click', () => {
          lastFocusedElement = card;
          const art = card.querySelector('.photo-art').cloneNode(true);

          lightboxVisual.innerHTML = '';
          lightboxVisual.appendChild(art);
          lightboxTitle.textContent =
            currentLanguage === 'zh' ? card.dataset.titleZh : card.dataset.titleEn;
          lightboxMeta.textContent = card.dataset.meta;
          lightbox.classList.add('open');
          document.body.style.overflow = 'hidden';
          lightboxClose.focus();
        });
      });

      lightboxClose?.addEventListener('click', closeLightbox);

      lightbox?.addEventListener('click', (event) => {
        if (event.target === lightbox) closeLightbox();
      });

      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && lightbox?.classList.contains('open')) {
          closeLightbox();
        }
      });

      const observer = 'IntersectionObserver' in window
        ? new IntersectionObserver(
            (entries) => {
              entries.forEach((entry) => {
                if (entry.isIntersecting) {
                  entry.target.classList.add('visible');
                  observer.unobserve(entry.target);
                }
              });
            },
            { threshold: 0.1 },
          )
        : null;

      document.querySelectorAll('.reveal').forEach((element) => {
        if (observer) observer.observe(element);
        else element.classList.add('visible');
      });

      applyLanguage(currentLanguage);
      renderPostList();
      if (homeView && photographyView) showRoute(routeFromHash(), false);
      updateBackToTop();
    </script> </body> </html>
